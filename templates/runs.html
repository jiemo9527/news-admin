{% extends 'base.html' %}
{% block title %}运行记录{% endblock %}
{% block content %}
<section class="panel">
  <div class="section-title"><h1>运行记录</h1></div>
  <table class="table">
    <tr><th>ID</th><th>触发方式</th><th>状态</th><th>开始</th><th>完成</th><th>操作</th></tr>
    {% for run in runs %}
      <tr><td>#{{ run.id }}</td><td>{{ run.trigger_kind }}</td><td><span class="status-pill status-{{ run.status|lower }}">{{ run.status }}</span></td><td>{{ run.started_at|datetime_display }}</td><td>{{ run.completed_at|datetime_display }}</td><td><a href="{{ url_for('run_detail', run_id=run.id) }}">查看</a></td></tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
