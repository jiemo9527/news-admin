{% extends 'base.html' %}
{% block title %}计划任务表单{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h1>{{ '编辑计划' if schedule else '新增计划' }}</h1>
  <form method="post" class="form-grid">
    <label>名称<input name="name" value="{{ schedule.name if schedule else '' }}" required /></label>
    <label>Cron 表达式<input name="cron_expr" value="{{ schedule.cron_expr if schedule else '0 7 * * *' }}" required /></label>
    <label>时区<input name="timezone" value="{{ schedule.timezone if schedule else timezone_name }}" required /></label>
    <label class="check"><input type="checkbox" name="enabled" {% if not schedule or schedule.enabled %}checked{% endif %}/> 启用</label>
    <div class="span-2 actions"><button class="button primary" type="submit">保存</button></div>
  </form>
</section>
{% endblock %}
