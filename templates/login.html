<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理员登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=static_version) }}" />
</head>
<body>
  <main class="wrap page login-page">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-stack">
          {% for message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <section class="panel login-panel">
      <div class="eyebrow">Admin Access</div>
      <h1>管理员登录</h1>
      <p>控制面板、任务、来源、平台和设置页面都需要管理员认证。发布页与缩略图仍保持公开访问。</p>
      {% if bootstrap_exists %}
        <p class="field-note">已检测到首次生成密码。登录后请尽快进入设置页修改管理员密码。</p>
      {% endif %}
      <form method="post" class="form-grid">
        <input type="hidden" name="next" value="{{ next_path }}" />
        <label class="span-2">管理员账号<input name="username" autocomplete="username" required /></label>
        <label class="span-2">管理员密码<input type="password" name="password" autocomplete="current-password" required /></label>
        <div class="span-2 actions"><button class="button primary large" type="submit">登录后台</button></div>
      </form>
    </section>
  </main>
</body>
</html>
