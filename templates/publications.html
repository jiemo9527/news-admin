{% extends 'base.html' %}
{% block title %}发布页{% endblock %}
{% block content %}
<section class="panel">
  <div class="section-title"><h1>发布页</h1><a class="button" href="{{ url_for('published_latest') }}" target="_blank">打开最新</a></div>
  <table class="table">
    <tr><th>ID</th><th>运行</th><th>标题</th><th>创建时间</th><th>操作</th></tr>
    {% for publication in publications %}
      <tr><td>#{{ publication.id }}</td><td>#{{ publication.run_id }}</td><td>{{ publication.title }}</td><td>{{ publication.created_at|datetime_display }}</td><td><a href="{{ url_for('published', publication_id=publication.id) }}" target="_blank">打开</a></td></tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
