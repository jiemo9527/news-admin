{% extends 'base.html' %}
{% block title %}来源表单{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h1>{{ '编辑来源' if source else '新增来源' }}</h1>
  <form method="post" class="form-grid">
    <label>名称<input name="name" value="{{ source.name if source else '' }}" required /></label>
    <label>分类<input name="category" value="{{ source.category if source else '观察/补充' }}" /></label>
    <label class="span-2">主 URL<input name="url" value="{{ source.url if source else '' }}" required /></label>
    <label class="span-2">RSS URL<input name="rss_url" value="{{ source.rss_url if source else '' }}" /></label>
    <label class="span-2">Selectors<textarea name="selectors">{{ '\n'.join(source.selectors) if source else 'a' }}</textarea></label>
    <label class="span-2">Include Patterns<textarea name="include_patterns">{{ '\n'.join(source.include_patterns) if source else '' }}</textarea></label>
    <label class="span-2">Exclude Patterns<textarea name="exclude_patterns">{{ '\n'.join(source.exclude_patterns) if source else '' }}</textarea></label>
    <label class="span-2">备注<textarea name="notes">{{ source.notes if source else '' }}</textarea></label>
    <label class="check"><input type="checkbox" name="enabled" {% if not source or source.enabled %}checked{% endif %}/> 启用</label>
    <div class="span-2 actions"><button class="button primary" type="submit">保存</button></div>
  </form>
</section>
{% endblock %}
