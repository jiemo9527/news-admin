{% extends 'base.html' %}
{% block title %}平台管理{% endblock %}
{% block content %}
<section class="panel">
  <div class="section-title"><h1>平台管理</h1><a class="button" href="{{ url_for('platform_new') }}">新增平台</a></div>
  <table class="table">
    <tr><th>名称</th><th>类型</th><th>状态</th><th>配置</th><th>操作</th></tr>
    {% for platform in platforms %}
      <tr><td>{{ platform.name }}</td><td>{{ platform.kind }}</td><td><span class="status-pill {{ 'status-enabled' if platform.enabled else 'status-disabled' }}">{{ '启用' if platform.enabled else '停用' }}</span></td><td><code>{{ platform.config_json }}</code></td><td><a href="{{ url_for('platform_edit', platform_id=platform.id) }}">编辑</a></td></tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
