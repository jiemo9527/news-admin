{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth">
  <h1>管理员登录</h1>
  <form method="post" action="/login" class="form-stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>用户名</span><input name="username" value="admin" autocomplete="username" autocapitalize="off"></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" autofocus required></label>
    <button class="btn btn-primary btn-block">登录</button>
  </form>
  <p class="hint">首次初始化的管理员账号和密码打印在服务启动日志中，登录后可在「系统设置」修改。</p>
</div>
{% endblock %}
